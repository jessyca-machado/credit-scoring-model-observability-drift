global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Modelo em produção
  - job_name: credit-scoring-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]

  # Etapas batch do pipeline (ingestão, transformação, treino, drift).
  # honor_labels preserva job/stage enviados pelas etapas.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  # Infraestrutura da própria stack de observabilidade
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
