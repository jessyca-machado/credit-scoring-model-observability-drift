[project]
name = "credit-scoring"
version = "0.1.0"
description = "Credit Scoring com contratos de dados, detecção de drift, observabilidade e governança (LGPD)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "pandera>=0.20",
    "evidently>=0.4",
    "scipy>=1.13",
    "dowhy>=0.11",
    "mlflow>=2.14",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "jupyter>=1.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# D: docstrings (pydocstyle) | ANN: type hints | UP/B/I: boas práticas e imports
select = ["E", "F", "W", "I", "UP", "B", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"**/__init__.py" = ["D104"]
