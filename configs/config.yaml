seed: 42

dataset:
  name: german_credit            # Statlog German Credit Data (UCI id 144)
  source: https://archive.ics.uci.edu/dataset/144/statlog+german+credit+data
  file: data/raw/german.data

paths:
  raw: data/raw
  processed: data/processed
  reference: data/reference      # baseline (dados de treino) para comparação de drift
  production: data/production    # lotes simulados ao longo do tempo
  models: models

model:
  target: default
  test_size: 0.2
  cv_folds: 5
  n_iter: 40              # combinações na busca aleatória de hiperparâmetros
  min_frequency: 10       # categorias mais raras viram "infrequent" no one-hot
  cost_fn: 5.0            # custo de aprovar um mau pagador (matriz do German Credit)
  cost_fp: 1.0            # custo de recusar um bom pagador

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: credit-scoring

simulation:
  n_batches: 12                  # 12 meses de produção
  start_month: "2025-01"
  batch_size: 300                # solicitações por mês
  data_drift_start: 3            # índice 0-based: data drift a partir de abr/2025
  concept_drift_start: 7         # índice 0-based: concept drift a partir de ago/2025
  monthly_inflation: 0.03        # inflação mensal composta sobre credit_amount
  extend_duration_prob: 0.4      # fração máx. de clientes que alongam o prazo (+6/+12 meses)
  profile_weight: 3.0            # peso extra do novo perfil (conta negativa, sem histórico, emprego recente)
  flip_no_account: 0.5           # prob. máx. de default de bons pagadores sem conta corrente
  flip_overindebted: 0.5         # prob. máx. de default de bons pagadores com créditos em outras instituições

drift:
  psi_warning: 0.1
  psi_critical: 0.25
  ks_pvalue: 0.05
  auc_min: 0.70

serving:
  host: 0.0.0.0
  port: 8000
